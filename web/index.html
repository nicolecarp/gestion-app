<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nicole">
    <meta name="theme-color" content="#151014">
    <title>Nicole</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=3">
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="shortcut icon" href="/favicon.ico?v=3">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>

    <div class="grain"></div>

    <nav class="top-nav" id="topNav">
        <div class="nav-pill">
            <div class="nav-brand">
                <img src="img/asa-icon.png" alt="Nicole" class="brand-avatar">
                <span class="brand-text">Nicole</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a data-view="dashboard" class="nav-link active">
                    <span class="nav-icon">&#9679;</span>
                    <span>Dashboard</span>
                </a>
                <a data-view="work" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Trabajo</span>
                </a>
                <a data-view="university" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Universidad</span>
                </a>
                <a data-view="personal" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Personal</span>
                </a>
                <a data-view="health" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Salud</span>
                </a>
                <a data-view="cosplays" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Cosplays</span>
                </a>
                <a data-view="settings" class="nav-link">
                    <span class="nav-icon">&#9679;</span>
                    <span>Ajustes</span>
                </a>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Cambiar modo día / noche" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <main id="app">
        <div id="view-dashboard" class="view active"></div>
        <div id="view-work" class="view"></div>
        <div id="view-university" class="view"></div>
        <div id="view-personal" class="view"></div>
        <div id="view-health" class="view"></div>
        <div id="view-cosplays" class="view"></div>
        <div id="view-settings" class="view"></div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
                <button class="btn btn-primary" id="modalSave">Guardar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/eel.js"></script>
    <script src="js/curriculum_data.js?v=19"></script>
    <script src="js/app.js?v=28"></script>
</body>
</html>
